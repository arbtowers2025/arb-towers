<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ARB TOWERS • Totem</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#253442;--gold:#d9b36b;--muted:#c2ccd4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#fff}
main{height:100dvh;min-height:520px;display:flex;flex-direction:column;padding:clamp(12px,2.5vh,26px) clamp(12px,3vw,38px);gap:clamp(9px,1.7vh,20px);overflow:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-size:clamp(25px,4.5vw,45px);font-weight:800;letter-spacing:.03em}.brand span{color:var(--gold)}
.subtitle{font-size:clamp(12px,1.5vw,16px);color:var(--muted);margin-top:6px}
.weather-now{text-align:right}.weather-now strong{font-size:clamp(23px,3vw,34px)}.weather-now small{display:block;color:var(--muted);margin-top:5px}
.time{text-align:center;border-top:1px solid #485360;padding-top:clamp(8px,1.5vh,16px)}
#clock{font-size:clamp(27px,4vw,48px);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
#date{font-size:clamp(12px,1.5vw,17px);margin-top:5px}
.forecast{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(3px,.8vw,12px)}
.hour{background:var(--panel);border-radius:12px;text-align:center;padding:clamp(8px,1.2vh,14px) 2px;font-size:clamp(11px,1.5vw,16px)}
.hour .symbol{font-size:clamp(19px,2.8vw,29px);margin:5px 0}
.menu{flex:1;min-height:220px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(65px,1fr));gap:clamp(7px,1.3vh,16px);border-top:1px solid #485360;padding-top:clamp(9px,1.7vh,20px)}
.tile{background:var(--panel);border:1px solid #33495b;border-radius:16px;color:white;font-size:clamp(15px,2.3vw,23px);font-weight:700;cursor:pointer;touch-action:manipulation}
.tile .symbol{display:block;color:var(--gold);font-size:clamp(23px,3vw,36px);margin-bottom:7px}
.tile:active,.tile:focus-visible{outline:2px solid var(--gold)}
footer{text-align:center;color:#91a0ae;font-size:11px}
.overlay{position:fixed;inset:0;background:#101820;z-index:5;display:none;flex-direction:column;padding:clamp(15px,3vw,35px);overflow:auto}
.overlay.open{display:flex}
.overlay h2{color:var(--gold);font-size:clamp(24px,4vw,36px);margin:18px 0}
.back{align-self:flex-start;border:1px solid var(--gold);background:var(--panel);color:white;border-radius:10px;padding:12px 20px;font-size:18px;cursor:pointer}
.apts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1}
.apt{background:var(--panel);color:white;border:1px solid #465668;border-radius:12px;padding:15px;font-size:18px;cursor:pointer}
.notice{color:var(--muted);font-size:clamp(14px,2vw,18px);line-height:1.5}
@media(max-height:650px){main{gap:7px;padding-top:10px;padding-bottom:8px}.hour{padding:5px 2px}.hour .symbol{margin:2px 0}.time{padding-top:6px}.menu{padding-top:7px;gap:6px}.tile .symbol{margin-bottom:2px}}
</style></head><body>
<main>
<header><div><div class="brand">ARB <span>TOWERS</span></div><div class="subtitle">Bine ați venit acasă!</div></div><div class="weather-now"><strong id="temp">--°C ☀️</strong><small id="condition">Se încarcă vremea...</small><small>Vișan • Iași</small></div></header>
<div class="time"><div id="clock">--:--:--</div><div id="date">Se încarcă data...</div></div>
<div class="forecast" id="forecast" aria-label="Prognoza pe următoarele 6 ore"></div>
<div class="menu">
<button class="tile" onclick="show('Anunțuri')"><span class="symbol">📢</span>Anunțuri</button>
<button class="tile" onclick="show('Programări')"><span class="symbol">📅</span>Programări</button>
<button class="tile" onclick="show('Contact')"><span class="symbol">☎️</span>Contact</button>
<button class="tile" onclick="show('Interfon')"><span class="symbol">🚪</span>Interfon</button>
<button class="tile" onclick="show('Locatari')"><span class="symbol">🏠</span>Locatari</button>
<button class="tile" onclick="show('Curent / Apă')"><span class="symbol">💧</span>Curent / Apă</button>
</div><footer>ARB TOWERS • VIȘAN, IAȘI</footer>
</main>
<section class="overlay" id="overlay"><button class="back" onclick="hide()">← Înapoi</button><h2 id="sectionTitle"></h2><div id="sectionBody"></div></section>
<script>
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ro-RO',{timeZone:'Europe/Bucharest',hour12:false});let s=d.toLocaleDateString('ro-RO',{timeZone:'Europe/Bucharest',weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('date').textContent=s.charAt(0).toUpperCase()+s.slice(1)}
tick();setInterval(tick,1000);
function description(c){if(c===0)return "Senin";if(c===1)return "Mai mult senin";if(c===2)return "Parțial noros";if(c===3)return "Înnorat";if(c===45||c===48)return "Ceață";if(c>=51&&c<=57)return "Burniță";if(c>=61&&c<=67)return "Ploaie";if(c>=71&&c<=77)return "Ninsoare";if(c>=80&&c<=82)return "Averse de ploaie";if(c>=85&&c<=86)return "Averse de ninsoare";if(c>=95)return "Furtună";return "Vreme variabilă"}
function icon(c,day){if(c===0)return day?'☀️':'🌙';if(c<=3)return '⛅';if(c<=48)return '🌫️';if(c<=67)return '🌧️';if(c<=77)return '❄️';if(c<=82)return '🌦️';if(c<=86)return '❄️';return '⛈️'}
async function weather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=47.10&longitude=27.63&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day&forecast_days=2&timezone=Europe%2FBucharest';const res=await fetch(url);if(!res.ok)throw Error('weather');const j=await res.json();document.getElementById('temp').textContent=Math.round(j.current.temperature_2m)+'°C '+icon(j.current.weather_code,j.current.is_day);document.getElementById('condition').textContent=description(j.current.weather_code);const idx=j.hourly.time.findIndex(t=>t>j.current.time);const start=Math.max(0,idx);const out=document.getElementById('forecast');out.replaceChildren();for(let i=start;i<Math.min(start+6,j.hourly.time.length);i++){const box=document.createElement('div');box.className='hour';const h=document.createElement('div');h.textContent=j.hourly.time[i].slice(11,16);const ic=document.createElement('div');ic.className='symbol';ic.textContent=icon(j.hourly.weather_code[i],j.hourly.is_day[i]);const t=document.createElement('div');t.textContent=Math.round(j.hourly.temperature_2m[i])+'°';box.append(h,ic,t);out.append(box)}}catch(e){document.getElementById('temp').textContent='--°C';document.getElementById('condition').textContent='Meteo indisponibil';document.getElementById('forecast').textContent='Verificați conexiunea la internet pentru prognoză.'}}
weather();setInterval(weather,600000);
function show(name){document.getElementById('overlay').classList.add('open');document.getElementById('sectionTitle').textContent=name;const body=document.getElementById('sectionBody');body.replaceChildren();if(name==='Locatari'||name==='Interfon'){const info=document.createElement('p');info.className='notice';info.textContent=name==='Interfon'?'Selectați apartamentul. Apelarea video va fi disponibilă numai după integrarea cu interfonul existent.':'Directorul celor 14 apartamente (fără date personale).';body.append(info);const grid=document.createElement('div');grid.className='apts';for(let i=1;i<=14;i++){const b=document.createElement('button');b.className='apt';b.textContent='Apartament '+i;b.onclick=()=>{const p=document.createElement('p');p.className='notice';p.textContent='Apartamentul '+i+': apelul video nu este încă configurat.';body.replaceChildren(p)};grid.append(b)}body.append(grid)}else{const p=document.createElement('p');p.className='notice';p.textContent='Secțiunea „'+name+'” este în pregătire. Informațiile vor fi adăugate de administratorul ARB Towers.';body.append(p)}}
function hide(){document.getElementById('overlay').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
</script></body></html>
