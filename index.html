  const link=CONFIG.whatsapp.trim();
  body=link.startsWith("https://chat.whatsapp.com/")?
  `<p>Scanați codul QR pentru a accesa grupul ARB TOWERS.</p><img class="qr" alt="Cod QR pentru grup" src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(link)}"><p style="text-align:center"><a class="phone" target="_blank" rel="noopener noreferrer" href="${escapeHTML(link)}">Deschide grupul WhatsApp ↗</a></p>`:
  `<div class="notice"><h3>Comunitatea ARB TOWERS</h3><p>Codul QR pentru grupul celor 14 apartamente va apărea după adăugarea linkului de invitație.</p></div>`;
 }
 el("modalTitle").textContent=title;el("modalBody").innerHTML=body;
 el("modal").classList.add("open");resetCloseTimer();
}
function closePage(){el("modal").classList.remove("open");clearTimeout(closeTimer);}
function resetCloseTimer(){clearTimeout(closeTimer);closeTimer=setTimeout(closePage,120000);}
el("modal").addEventListener("pointerdown",resetCloseTimer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePage();});
/* SVG meteo — fără emoji, fără iconițe de pe internet. */
function weatherCode(code,isDay=true){
 if(!isDay&&code===0)return {type:"moon",desc:"Senin"};
 if(code===0)return {type:"sun",desc:"Însorit"};
 if(code===1||code===2)return {type:isDay?"partly":"cloud",desc:"Parțial noros"};
 if(code===3)return {type:"cloud",desc:"Noros"};
 if(code===45||code===48)return {type:"fog",desc:"Ceață"};
 if(code>=51&&code<=57)return {type:"rain",desc:"Burniță"};
 if(code>=61&&code<=67)return {type:"rain",desc:"Ploaie"};
 if(code>=71&&code<=77)return {type:"snow",desc:"Ninsoare"};
 if(code>=80&&code<=82)return {type:"rain",desc:"Averse de ploaie"};
 if(code>=85&&code<=86)return {type:"snow",desc:"Averse de ninsoare"};
 if(code>=95)return {type:"storm",desc:"Furtună"};
 return {type:"cloud",desc:"Vreme variabilă"};
}
function svgWeather(type,id){
 const base=`<defs>
 <linearGradient id="cl${id}" x1="0" y1="0" x2="0.75" y2="1"><stop stop-color="#f6fbff"/><stop offset=".47" stop-color="#a2c6e9"/><stop offset="1" stop-color="#487aaf"/></linearGradient>
 <linearGradient id="sun${id}" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#fff8bb"/><stop offset="1" stop-color="#ffab42"/></linearGradient>
 <linearGradient id="rain${id}" x1="0" x2="0.7" y1="0" y2="1"><stop stop-color="#a7e5ff"/><stop offset="1" stop-color="#0079ff"/></linearGradient>
 <filter id="sh${id}"><feGaussianBlur stdDeviation="2.1"/></filter></defs>`;
 const sun=`<g stroke="#ffd47d" stroke-width="4.2" stroke-linecap="round" opacity=".92">${Array.from({length:8},(_,i)=>{const a=i*Math.PI/4;return `<path d="M ${58+Math.cos(a)*29} ${41+Math.sin(a)*29} L ${58+Math.cos(a)*35} ${41+Math.sin(a)*35}"/>`}).join("")}</g><circle cx="58" cy="41" r="22" fill="url(#sun${id})"/><circle cx="52" cy="34" r="8" fill="#fff9d3" opacity=".5"/>`;
 const cloud=`<g><path d="M28 82C7 81 10 55 30 51C34 30 58 22 76 39C94 30 117 40 119 62C132 68 126 86 110 87H31Z" fill="#000" opacity=".28" transform="translate(1 4)" filter="url(#sh${id})"/><path d="M28 82C7 81 10 55 30 51C34 30 58 22 76 39C94 30 117 40 119 62C132 68 126 86 110 87H31Z" fill="url(#cl${id})"/><path d="M30 53C40 32 59 34 70 43" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".57"/></g>`;
 const rain=`<g stroke="url(#rain${id})" stroke-width="4.5" stroke-linecap="round"><path d="M35 93l-7 14"/><path d="M58 93l-7 14"/><path d="M81 93l-7 14"/><path d="M104 93l-7 14"/></g>`;
 const snow=`<g stroke="#d8f6ff" stroke-width="2.6" stroke-linecap="round">${[37,70,101].map(x=>`<path d="M${x} 95v17 M${x-7} 103.5h14 M${x-5} 98.5l10 10 M${x+5} 98.5l-10 10"/>`).join("")}</g>`;
 const moon=`<path d="M88 23C59 13 35 39 41 68c5 25 29 34 49 25-22 0-38-15-39-35-2-15 9-29 37-35Z" fill="url(#sun${id})"/><circle cx="92" cy="28" r="3" fill="#e9f7ff"/><circle cx="108" cy="52" r="2" fill="#e9f7ff"/>`;
 const fog=`${cloud}<g stroke="#d1e6fc" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M29 96h78"/><path d="M40 108h62"/></g>`;
 const bolt=`<path d="M77 81L57 104h17l-9 18 33-31H79L88 81Z" fill="#ffd56a" stroke="#fff0b0" stroke-width="2"/>`;
 let contents=type==="sun"?sun:type==="moon"?moon:type==="partly"?`<g transform="translate(-20,-9) scale(.82)">${sun}</g>${cloud}`:type==="fog"?fog:cloud;
 if(type==="rain")contents+=rain;
 if(type==="snow")contents+=snow;
 if(type==="storm")contents+=bolt;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 132" role="img" aria-label="${type}">${base}${contents}</svg>`;
}
let sceneType="cloud",isNight=false,weatherLast=0;
function drawInitialForecast(){
 const host=el("forecast");host.replaceChildren();
 const now=new Date();
 const hourParts=new Intl.DateTimeFormat("ro-RO",{hour:"2-digit",hour12:false,timeZone:RO_TZ}).format(now);
 let start=Number(hourParts);
 for(let i=0;i<6;i++){
  const card=document.createElement("div");card.className="forecast-card";
  card.innerHTML=`<span class="forecast-time">${String((start+i)%24).padStart(2,"0")}:00</span><span class="forecast-svg">${svgWeather("cloud","initial"+i)}</span><span class="forecast-degrees">--°</span>`;
  host.append(card);
 }
 el("currentGlyph").innerHTML=svgWeather("cloud","current0");
}
drawInitialForecast();
function updateScene(){
 const sky=el("scene");
 sky.className=isNight?"night":sceneType==="rain"||sceneType==="storm"?"rainy":sceneType==="snow"?"snowy":sceneType==="cloud"||sceneType==="fog"?"cloudy":"day";
}
async function fetchWeather(){
 try{
  const url="https://api.open-meteo.com/v1/forecast?latitude=47.12&longitude=27.63&current=temperature_2m,weather_code,is_day,precipitation&hourly=temperature_2m,weather_code,is_day&forecast_days=2&timezone=Europe%2FBucharest";
  const response=await fetch(url,{cache:"no-store"});
  if(!response.ok)throw new Error("Conexiune");
  const data=await response.json(),now=data.current,hourly=data.hourly;
  isNight=now.is_day===0;
  const curr=weatherCode(now.weather_code,!isNight);
  sceneType=curr.type;
  if(Number(now.precipitation)>0&&["cloud","partly","sun"].includes(sceneType))sceneType="rain";
  updateScene();
  el("currentGlyph").innerHTML=svgWeather(sceneType,"current");
  el("temperature").textContent=Math.round(now.temperature_2m)+"°C";
  el("condition").textContent=curr.desc;
  const startKey=now.time.slice(0,13)+":00";
  let start=hourly.time.findIndex(t=>t>=startKey);
  if(start<0)start=0;
  const host=el("forecast");
  const cards=[];
  for(let i=start;i<Math.min(start+6,hourly.time.length);i++){
   const hourType=weatherCode(hourly.weather_code[i],Boolean(hourly.is_day[i]));
   const card=document.createElement("div");card.className="forecast-card";
   const t=document.createElement("span");t.className="forecast-time";t.textContent=hourly.time[i].slice(11,16);
   const icon=document.createElement("span");icon.className="forecast-svg";icon.innerHTML=svgWeather(hourType.type,"h"+i);
   const deg=document.createElement("span");deg.className="forecast-degrees";deg.textContent=Math.round(hourly.temperature_2m[i])+"°";
   card.append(t,icon,deg);cards.push(card);
  }
  if(cards.length)host.replaceChildren(...cards);
  weatherLast=Date.now();el("apiStatus").textContent="Meteo actualizat automat · Open-Meteo";
 }catch(err){
  el("apiStatus").textContent=weatherLast?"Date meteo temporar neactualizate":"Meteo indisponibil momentan · necesită internet";
  if(!weatherLast)el("condition").textContent="Meteo indisponibil";
 }
}
fetchWeather();setInterval(fetchWeather,10*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-weatherLast>9*60*1000)fetchWeather();});
// Ploaie, fulgi, soare și fulgere, controlate de vremea reală.
const canvas=el("particles"),ctx=canvas.getContext("2d");let drops=[],phase=0;
function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 drops=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,speed:2.5+Math.random()*6,length:8+Math.random()*20,rad:1+Math.random()*2.5}));
}
resize();window.addEventListener("resize",resize);
function animate(){
 const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);phase+=.007;
 if(["rain","storm"].includes(sceneType)){
  ctx.lineWidth=1.3;ctx.strokeStyle="rgba(150,210,255,.48)";
  for(const d of drops){
   ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-3.2,d.y+d.length);ctx.stroke();
   d.y+=d.speed*1.65;d.x-=1.15;
   if(d.y>h+25){d.y=-30;d.x=Math.random()*w;}
  }
  if(sceneType==="storm"&&Math.random()<.003){
   ctx.fillStyle="rgba(200,227,255,.18)";ctx.fillRect(0,0,w,h);
  }
 }else if(sceneType==="snow"){
  ctx.fillStyle="rgba(239,249,255,.8)";
  for(const d of drops){
   ctx.beginPath();ctx.arc(d.x,d.y,d.rad,0,Math.PI*2);ctx.fill();
   d.y+=d.speed*.33;d.x+=Math.sin(phase+d.y*.025)*.48;
   if(d.y>h+5){d.y=-10;d.x=Math.random()*w;}
  }
 }else if(["sun","partly"].includes(sceneType)&&!isNight){
  const x=w*.86,y=h*.11,g=ctx.createRadialGradient(x,y,4,x,y,w*.32);
  g.addColorStop(0,"rgba(255,221,145,.25)");g.addColorStop(1,"rgba(255,221,145,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 }else if(sceneType==="cloud"){
  for(let i=0;i<3;i++){
   const x=w*(.68+i*.11)+Math.sin(phase*.5+i)*25,y=h*(.12+i*.075);
   const g=ctx.createRadialGradient(x,y,5,x,y,130);
   g.addColorStop(0,"rgba(222,238,255,.065)");g.addColorStop(1,"rgba(222,238,255,0)");
   ctx.fillStyle=g;ctx.fillRect(x-140,y-140,280,280);
  }
 }
 requestAnimationFrame(animate);
}
animate();
</script>
