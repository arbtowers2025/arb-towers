<html lang="ro">

<meta charset="UTF-8">

<title>ARB TOWERS | Nori naturali</title>
<style>
:root{--navy:#030c1e;--gold:#f7c780;--ice:#c7e6ff;--light:#f5f9ff;--glass:#092650d9;--rim:#188cf9}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{color:var(--light);background:var(--navy);font-family:"Segoe UI",Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;background:
 radial-gradient(ellipse 80% 85% at 72% 15%,#174a81 0%,#071c40 52%,#020918 100%);
 transition:background 2s ease;overflow:hidden}
#scene.day{background:radial-gradient(ellipse 72% 80% at 80% 8%,#246eac 0%,#0b305e 45%,#020e26 98%)}
#scene.cloudy{background:radial-gradient(ellipse at 80% 4%,#2b4d73 0%,#0c2345 51%,#020a1e 95%)}
#scene.rainy{background:radial-gradient(ellipse at 82% 5%,#29425e 0%,#0a1b35 48%,#020817 100%)}
#scene.snowy{background:radial-gradient(ellipse at 75% 10%,#4c6d8f 0%,#163658 48%,#031228 100%)}
#scene.night{background:radial-gradient(ellipse at 75% 10%,#0c2855 0%,#041433 52%,#010713 100%)}
#scene::before{content:"";position:absolute;inset:-25%;opacity:.26;background:
 repeating-linear-gradient(120deg,transparent 0,transparent 52px,#9dc6ff05 54px,transparent 56px),
 radial-gradient(ellipse 37% 23% at 70% 20%,#b3d8ff30,transparent 96%);
 transform:translate3d(0,0,0);animation:skyDrift 32s ease-in-out infinite alternate}
@keyframes skyDrift{to{transform:translate3d(-6%,2%,0)}}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0109189c 0%,transparent 30%),linear-gradient(90deg,#03102540 0%,transparent 78%);pointer-events:none}
#particles{position:fixed;inset:0;pointer-events:none;z-index:6}
.ambient{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff12 1px,transparent 1px);background-size:31px 31px;opacity:.09}
.building{position:absolute;z-index:1;right:-.7vw;bottom:-1.1vh;width:44vw;height:76.5vh;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.building::before{content:"";position:absolute;z-index:-1;inset:12% 1% 3%;border-radius:50%;background:radial-gradient(ellipse,#1c639a4d 0%,#061d3b32 48%,transparent 74%);filter:blur(20px)}
.building img{height:100%;width:100%;object-fit:contain;object-position:center bottom;filter:contrast(1.09) saturate(1.22) drop-shadow(0 22px 29px #000c);mask-image:linear-gradient(to top,#000 0%,#000 98%,#000);-webkit-mask-image:linear-gradient(to top,#000 0%,#000 98%,#000)}
.building::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#061731 0%,#0617316c 12%,transparent 36%),linear-gradient(0deg,#05152b85,transparent 17%)}
.frame{position:relative;z-index:3;display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;padding:clamp(18px,2.5vh,38px) clamp(22px,3vw,72px) clamp(12px,1.5vh,26px)}
.head{display:grid;grid-template-columns:1.22fr .9fr .9fr;align-items:start;gap:1.1vw;height:24%;min-height:0}
.identity{min-width:0;padding-top:.5vh}
.brand{display:inline-flex;gap:.18em;align-items:baseline;white-space:nowrap;font-size:clamp(31px,4.05vw,78px);line-height:1.13;font-weight:900;letter-spacing:-.048em;filter:drop-shadow(0 3px 9px #000d)}
.brand .arb{color:#f9fdff;text-shadow:0 1px 0 #d7e3f4,0 2px 0 #8c9eb1,0 3px 0 #2f4964}
.brand .towers{background:linear-gradient(#ffedae 2%,#ffcc72 48%,#a75c22 97%);background-clip:text;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 2px 3px #0008)}
.brand-rule{height:2px;width:100%;max-width:31vw;background:linear-gradient(90deg,#d49e5a,var(--gold) 65%,transparent);margin:7px 0 9px;box-shadow:0 0 10px #ffcc7940}
.tagline{font-size:clamp(10px,1.17vw,19px);letter-spacing:.27em;word-spacing:.28em;color:#eaf3ff}
.clock{text-align:center;min-width:0;padding-top:.4vh}
.clock-time{font-size:clamp(36px,4.25vw,80px);line-height:1.25;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;background:linear-gradient(#ffe4b4,#ffbf65 75%,#d99b4d);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 7px 25px #dc9b291c}
.clock-date{color:#e8f0ff;font-size:clamp(12px,1.2vw,21px);text-transform:capitalize;white-space:nowrap}
.current{justify-self:end;display:flex;align-items:center;gap:.8vw;padding-top:0;min-width:0}
.current-glyph{height:clamp(64px,7.2vw,125px);width:clamp(64px,7.2vw,125px);filter:drop-shadow(0 6px 11px #0008)}
.current-label{text-align:left;min-width:0}
.current-temp{font-size:clamp(33px,4vw,75px);line-height:1.12;font-weight:800;letter-spacing:-.04em;white-space:nowrap}
.current-desc{font-size:clamp(12px,1.32vw,25px);margin-top:2px}
.current-place{font-size:clamp(11px,1vw,19px);margin-top:8px;white-space:nowrap;color:#e9eefb}
.main{width:61.3%;display:flex;flex:1;flex-direction:column;gap:clamp(16px,2.2vh,30px);min-height:0}
.forecast{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,.7vw,14px);height:28%;min-height:94px}
.forecast-card{min-width:0;border:1.5px solid #1895ff;border-radius:clamp(10px,1vw,18px);background:linear-gradient(150deg,#062d60e8 0%,#082a57c9 50%,#041a37e8 100%);box-shadow:inset 0 1px 15px #037bd65b,0 8px 23px #0006,0 0 8px #168bff29;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1px,.55vh,9px);overflow:hidden}
.forecast-card:first-child{border-color:#6ac4ff;box-shadow:inset 0 1px 17px #168bff85,0 0 13px #168bff55}
.forecast-time{font-size:clamp(12px,1.2vw,23px);font-weight:700;white-space:nowrap}
.forecast-svg{width:65%;height:50%;max-width:100px;min-height:37px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 7px #0007)}
.forecast-svg svg,.current-glyph svg{width:100%;height:100%;display:block}
.forecast-degrees{color:#f5fbff;text-shadow:0 1px 4px #000a,0 0 10px #72c9ff40}
.forecast-degrees{font-size:clamp(14px,1.5vw,26px);font-weight:750;white-space:nowrap}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(10px,1.3vw,22px);flex:1;min-height:0}
.tile{min-width:0;min-height:0;position:relative;overflow:hidden;border:1.5px solid #299eff;border-radius:clamp(13px,1.3vw,23px);background:linear-gradient(112deg,#045bb3e8 0%,#073875ef 31%,#062551ee 100%);box-shadow:inset 0 1px 20px #178cfa75,0 6px 23px #000a,0 0 10px #197de64a;color:white;display:flex;align-items:center;gap:.8vw;padding:.8vw 1.1vw .8vw .9vw;cursor:pointer;text-align:left;transition:filter .2s,transform .2s,border-color .2s}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,#61c5ff2c,transparent);pointer-events:none}
.tile::after{content:"";position:absolute;left:18%;right:18%;top:-1px;height:2px;background:linear-gradient(90deg,transparent,#c1e9ffad,transparent);pointer-events:none}
.tile:hover,.tile:focus-visible{filter:brightness(1.18);border-color:#a3e7ff;transform:translateY(-2px)}
.tile:active{transform:scale(.987)}
.icon-img{position:relative;z-index:1;object-fit:contain;flex:0 0 auto;width:clamp(75px,10vw,175px);height:clamp(72px,11.2vh,148px);filter:drop-shadow(0 4px 8px #0007)}
.tile-copy{position:relative;z-index:1;min-width:0;flex:1;display:block}
.tile-name{display:block;font-size:clamp(20px,2vw,38px);font-weight:780;letter-spacing:-.02em;white-space:nowrap}
.tile-sub{display:block;font-size:clamp(11px,1.09vw,20px);margin-top:clamp(3px,.8vh,10px);color:#c7dff7;white-space:nowrap}
.chevron{position:relative;z-index:1;color:#b2d6fa;font-size:clamp(25px,2.4vw,40px);font-weight:200;line-height:1}
.foot{display:flex;align-items:center;justify-content:center;gap:1.8vw;color:var(--gold);font-size:clamp(11px,1.03vw,21px);letter-spacing:.3em;font-weight:500;white-space:nowrap;padding-top:clamp(12px,2vh,25px)}
.foot::before,.foot::after{content:"";width:13%;height:1px;background:linear-gradient(90deg,transparent,#dfbb7f)}.foot::after{transform:rotate(180deg)}
.api-status{position:absolute;bottom:1.2vh;left:3vw;font-size:clamp(10px,.7vw,14px);color:#a0bad4b8;max-width:40%}
.modal{position:fixed;z-index:50;inset:0;display:none;justify-content:center;align-items:center;padding:24px;background:#010714e8;backdrop-filter:blur(14px)}
.modal.open{display:flex}
.panel{position:relative;width:min(850px,94vw);max-height:88vh;overflow:auto;padding:clamp(22px,3vw,45px);border-radius:22px;border:1.5px solid #65b8ff;background:linear-gradient(155deg,#143f79,#061a36 86%);box-shadow:inset 0 1px 28px #2d98fc41,0 25px 70px #000b}
.panel h2{color:var(--gold);font-size:clamp(26px,2.5vw,42px);margin:0 0 20px}.panel h3{font-size:clamp(18px,1.5vw,26px);margin:12px 0}
.panel p,.panel li{font-size:clamp(16px,1.3vw,22px);line-height:1.6}
.panel li{margin:5px 0}.notice{padding:18px 22px;border:1px solid #478ddc80;background:#ffffff12;border-radius:13px;margin:13px 0}
.warning{border-left:5px solid var(--gold);background:#ffb13a12;padding:15px 21px;border-radius:6px}
.back{border:1px solid #78bfff;background:linear-gradient(#177be2,#0952a6);color:white;padding:13px 24px;border-radius:12px;font-size:19px;cursor:pointer;margin-top:20px}
.back:focus-visible{outline:3px solid var(--gold)}
.phone{color:#e9d19d;text-decoration:none;font-weight:700}.qr{padding:13px;background:white;border-radius:12px;margin:14px auto;display:block;width:210px;height:210px}
@media(max-width:1100px){.frame{padding:14px 2vw 10px}.building{width:45vw;height:75vh}.main{width:62%}.icon-img{width:8.3vw}.tile{padding:.65vw}.tile-sub{font-size:1.05vw}.brand{font-size:3.95vw}.clock-time{font-size:4.1vw}}
@media(max-width:750px){.frame{padding:13px}.head{height:26%;grid-template-columns:1fr 1fr;gap:7px}.identity{grid-column:1}.clock{grid-row:2;grid-column:1;text-align:left}.current{grid-row:1;grid-column:2}.brand{font-size:clamp(27px,5vw,42px)}.tagline{font-size:9px;letter-spacing:.12em}.clock-time{font-size:clamp(27px,5vw,44px)}.clock-date{font-size:10px}.current-glyph{height:58px;width:58px}.current-temp{font-size:28px}.current-desc{font-size:11px}.current-place{font-size:9px}.building{width:95%;height:65%;opacity:.30}.main{width:100%;gap:13px}.forecast{height:25%;gap:5px}.forecast-card{border-radius:9px}.forecast-time{font-size:12px}.forecast-svg{width:85%;min-height:28px}.forecast-degrees{font-size:13px}.menu{gap:9px}.tile{padding:8px}.icon-img{width:clamp(54px,15vw,96px);height:clamp(63px,12vh,115px)}.tile-name{font-size:clamp(15px,3vw,25px)}.tile-sub{display:none}.chevron{font-size:22px}.foot{font-size:9px;letter-spacing:.13em}.api-status{display:none}}
@media(prefers-reduced-motion:reduce){#scene::before{animation:none}.tile{transition:none}}

/* ARB TOWERS: versiunea fără bloc, cu centrul ecranului dedicat meniului */

.current{justify-self:end}
.main{width:min(100%,1380px);margin-left:auto;margin-right:auto;gap:clamp(18px,2.7vh,34px)}
.forecast{height:26%;gap:clamp(10px,1vw,20px)}
.forecast-card{border-radius:clamp(12px,1vw,21px)}
.menu{gap:clamp(14px,1.6vw,25px)}
.tile{padding:.8vw 2vw;gap:1.3vw;border-radius:clamp(16px,1.5vw,28px)}
.icon-img{width:clamp(105px,9vw,162px);height:clamp(100px,12vh,166px)}
.tile-name{font-size:clamp(24px,2.4vw,46px)}
.tile-sub{font-size:clamp(13px,1.25vw,23px)}
.foot{padding-top:clamp(16px,2.4vh,28px)}

/* Vreme cinematică — adaptare desktop / totem / telefon */

#scene{background-attachment:fixed}

.current-glyph svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 9px 12px #0006)}

.bank-a{left:-14%;top:-12%;animation:skySlideA 63s ease-in-out infinite alternate}
.bank-b{left:36%;top:-9%;transform:scaleX(-1);animation:skySlideB 79s ease-in-out infinite alternate;opacity:.9}
.bank-c{left:-18%;top:18%;opacity:.45;animation:skySlideC 88s ease-in-out infinite alternate}
@keyframes skySlideA{to{transform:translateX(13vw) translateY(2vh)}}
@keyframes skySlideB{to{transform:translateX(-12vw) scaleX(-1)}}
@keyframes skySlideC{to{transform:translateX(19vw) translateY(-2vh)}}
#cinematicBeam{position:fixed;z-index:2;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s;background:radial-gradient(ellipse at 76% -5%,#ffebb333 0%,#ffe9ad15 24%,transparent 55%)}
#scene.rainy + #cinematicClouds,#scene.snowy + #cinematicClouds,#scene.cloudy + #cinematicClouds,#scene.night + #cinematicClouds{opacity:1}
#scene.day + #cinematicClouds{opacity:.25}
#scene.day ~ #cinematicBeam{opacity:1}
/* Separate phone layout from landscape kiosk; preserve centered, large touch tiles. */
@media(max-width:750px){
 #cinematicClouds .cloud-bank{width:145vw;min-width:0;height:34vh;min-height:190px}
 .bank-a{left:-42%;top:-5%}.bank-b{left:10%;top:3%}.bank-c{left:-40%;top:28%;opacity:.28}
 .frame{padding:14px 4vw 18px}
 .head{height:25%;min-height:0}
 .main{gap:clamp(12px,2.1vh,20px)}
 .forecast{height:28%}
 .menu{gap:10px}
 .tile{padding:12px 9px;align-items:center}
 .icon-img{width:clamp(56px,12vw,85px)}
 .tile-name{font-size:clamp(17px,3.3vw,24px)}
 .chevron{font-size:24px}
 .foot{padding-top:12px}
}
@media (orientation:landscape) and (min-width:751px){#cinematicClouds .cloud-bank{height:49vh}}
@media(prefers-reduced-motion:reduce){#cinematicClouds .cloud-bank{animation:none}}

@media(max-width:750px){.head{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}.current{gap:2px;justify-self:end;max-width:100%}.current-glyph{width:46px;height:51px;flex:none}.current-label{min-width:0}.current-temp{font-size:25px}.current-desc{font-size:10px}.current-place{font-size:9px;white-space:nowrap}.clock-time{font-size:clamp(30px,7vw,44px)}}

/* ARB TOWERS – cer cinematic cu nori 3D, inspirat din referința utilizatorului */
#scene.rainy{background:radial-gradient(ellipse 95% 60% at 72% 18%,#55758e 0%,#1d3952 38%,#06162c 74%,#030a17 100%)}
#scene.snowy{background:radial-gradient(ellipse 95% 65% at 70% 12%,#a5b9c9 0%,#51738e 38%,#11283e 75%,#061427 100%)}
#scene.cloudy{background:radial-gradient(ellipse 90% 65% at 72% 16%,#6a869a 0%,#254461 39%,#08172e 100%)}
#scene.day{background:radial-gradient(ellipse 95% 80% at 77% 9%,#77c7f4 0%,#2589c8 34%,#0d3b67 76%,#051d39 100%)}
#cinematicClouds{opacity:.9;mask-image:linear-gradient(to bottom,#000 0%,#000 49%,transparent 84%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 49%,transparent 84%)}
#cinematicClouds .cloud-bank{filter:drop-shadow(0px 26px 20px #031022cc) drop-shadow(0px 0px 22px #d9eeff4a);height:53vh;min-height:290px}
.bank-a{top:-12%;left:-23%}.bank-b{top:-10%;left:32%;opacity:1}.bank-c{top:10%;left:0%;opacity:.72}
#scene.rainy + #cinematicClouds,#scene.snowy + #cinematicClouds,#scene.cloudy + #cinematicClouds,#scene.night + #cinematicClouds{opacity:1}
#scene.day + #cinematicClouds{opacity:.55;filter:brightness(1.3)}
#particles{z-index:2;filter:drop-shadow(0 0 2px #cbe7ff77)}
.frame{z-index:4}
.forecast-card{backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);background-color:#071a36a6!important;box-shadow:inset 0 1px 22px #92cafa20,0 8px 22px #0008}
.tile{backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);box-shadow:inset 0 2px 25px #a0d7ff21,0 8px 28px #0009}
@media(max-width:750px){#cinematicClouds .cloud-bank{height:45vh;min-height:235px;width:170vw}.bank-a{left:-65%;top:-5%}.bank-b{left:-1%;top:2%}.bank-c{left:-38%;top:17%;opacity:.5}}


/* STORM SKY 3.0 — NEW rendered cloudscape, not the former gradient cloud banks */
#cinematicClouds{display:none!important}
#weatherWorld{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#102841 0%,#102c47 30%,#09213b 62%,#020b1d 100%)}
#weatherWorld .sky-photo{position:absolute;inset:-5% -5% -2%;width:110%;height:108%;filter:contrast(1.13) saturate(.9) drop-shadow(0 12px 24px #09192c);animation:skyFloat 35s ease-in-out infinite alternate}
#weatherWorld .horizon{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,#03122726 36%,#041529bb 65%,#020915f5 100%)}
#weatherWorld .depth{position:absolute;inset:0;background:radial-gradient(ellipse at 67% 19%,#eff7ff1f,transparent 27%),radial-gradient(ellipse at 12% 35%,#8daecc18,transparent 36%);mix-blend-mode:screen}
#weatherWorld .sun-disc{position:absolute;width:min(33vw,270px);height:min(33vw,270px);right:11%;top:6%;border-radius:50%;background:radial-gradient(circle,#ffefad 0 23%,#ffd362 25% 33%,#fff3b558 44%,transparent 72%);box-shadow:0 0 100px 30px #fbc36c77;opacity:0;transition:opacity 2s}
#weatherWorld .snow-layer{position:absolute;inset:0;background:linear-gradient(180deg,#f1faff23,transparent 64%);opacity:0}
#weatherWorld[data-weather="sun"] .sun-disc,#weatherWorld[data-weather="partly"] .sun-disc{opacity:1}
#weatherWorld[data-weather="sun"]{background:linear-gradient(#2b98d4,#7fc0d7 40%,#19456e)}
#weatherWorld[data-weather="sun"] .sky-photo{opacity:.20;filter:brightness(1.5)}
#weatherWorld[data-weather="partly"] .sky-photo{opacity:.53;filter:brightness(1.3)}
#weatherWorld[data-weather="snow"]{background:linear-gradient(#536d89,#879db0 47%,#172c48)}
#weatherWorld[data-weather="snow"] .sky-photo{filter:brightness(1.4) saturate(.48)}
#weatherWorld[data-weather="snow"] .snow-layer{opacity:1}
#weatherWorld[data-weather="rain"] .sky-photo,#weatherWorld[data-weather="storm"] .sky-photo{filter:brightness(.79) contrast(1.3) saturate(.75)}
#weatherWorld[data-weather="storm"]{background:#020d1c}
#weatherWorld[data-weather="storm"] .storm-glow{animation:flashStorm 11s infinite}
#weatherWorld .storm-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 65% 15%,#e7f6ffcc,transparent 66%);opacity:0}
#scene{opacity:0!important}
.frame{z-index:5!important;text-shadow:0 2px 8px #001426a8}
#particles{z-index:4!important}
.tile{background:linear-gradient(130deg,#15395bce,#092243ca)!important;box-shadow:inset 0 1px 0 #d5f3ff56,0 18px 40px #0009,0 0 20px #389bfb18!important;border-color:#8ac8fa85!important}
.forecast-card{background:linear-gradient(140deg,#183a5bdb,#061b38d9)!important;box-shadow:inset 0 1px 0 #d5f3ff55,0 12px 32px #0008!important;border-color:#83c2f47d!important}
@keyframes skyFloat{from{transform:translate3d(-1%,0,0) scale(1.04)}to{transform:translate3d(1%,-1.7%,0) scale(1.11)}}
@keyframes flashStorm{0%,34%,36%,37%,38%,78%,80%,100%{opacity:0}35%,37.4%,79%{opacity:.50}}
@media(max-width:750px){#weatherWorld .sky-photo{width:180%;left:-57%;top:-3%;height:94%}#weatherWorld .horizon{background:linear-gradient(transparent,#03122740 34%,#041529ba 62%,#020915f5 100%)}.frame{z-index:5!important}}
@media(prefers-reduced-motion:reduce){#weatherWorld .sky-photo,#weatherWorld .storm-glow{animation:none}}


/* Natural cloud photograph; all weather graphics stay inside their own boxes. */
#weatherWorld .sky-photo{object-fit:cover;object-position:64% 20%;filter:brightness(.82) saturate(.85);}
.current-glyph{flex:0 0 auto;overflow:hidden;contain:paint;}
.current-glyph svg{overflow:hidden;filter:none;}
.current{gap:12px;}
.current-label{position:relative;z-index:1;}
.current-desc,.current-place{color:#f5f9ff;text-shadow:0 2px 5px #000;}
.forecast-svg{overflow:hidden;contain:paint;}
.forecast-svg svg{overflow:hidden;}
@media(max-width:750px){
 .head{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:10px;}
 .current{gap:6px;max-width:100%;}
 .current-glyph{width:44px;height:52px;}
 .current-temp{font-size:25px;}.current-place{white-space:normal;font-size:9px;}
 #weatherWorld .sky-photo{width:120%;height:108%;left:-10%;top:-4%;object-position:65% 20%;}
}

</style>
</head>
